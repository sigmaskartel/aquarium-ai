<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Аквариум</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03070c; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e6f4ff; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }
  /* soft vignette so the lit tank stands out from the dark room */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 0, 0, .55) 100%); }
  .hud { position: fixed; z-index: 2; user-select: none; }
  .title { top: 18px; left: 22px; pointer-events: none; }
  .title h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .04em; }
  .title p { margin: 4px 0 0; font-size: 13px; opacity: .6; }
  .stats { top: 18px; right: 22px; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px;
    font-size: 13px; background: rgba(8, 20, 32, .55); border: 1px solid rgba(140, 200, 255, .18);
    border-radius: 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .stats b { display: inline-block; min-width: 62px; font-variant-numeric: tabular-nums; color: #8fd8ff; }
  .stats button { margin-top: 6px; padding: 7px 10px; font: inherit; color: inherit; cursor: pointer;
    background: rgba(90, 170, 230, .18); border: 1px solid rgba(140, 200, 255, .35); border-radius: 8px; }
  .stats button:hover { background: rgba(90, 170, 230, .32); }
  .stats button[aria-pressed="true"] { background: #2f8fd0; border-color: #8fd8ff; }
  .hint { left: 0; right: 0; bottom: 16px; text-align: center; font-size: 12px; opacity: .5; pointer-events: none; }
  #loading { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; font-size: 15px;
    letter-spacing: .06em; background: #03070c; transition: opacity .6s; }
  #loading.done { opacity: 0; pointer-events: none; }
  @media (max-width: 700px) {
    .title { top: 12px; left: 14px; }
    .title h1 { font-size: 18px; }
    .title p { display: none; }
    .stats { top: 12px; right: 12px; padding: 8px 10px; font-size: 11px; gap: 3px; }
    .stats b { min-width: 52px; }
    .hint { font-size: 11px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header class="hud title">
  <h1>Аквариум</h1>
  <p>3D-модель · процедурные полигональные рыбки</p>
</header>

<aside class="hud stats">
  <div><b id="st-fish">0</b> рыб</div>
  <div><b id="st-poly">0</b> полигонов</div>
  <div><b id="st-fps">0</b> FPS</div>
  <button id="btn-wire" type="button" aria-pressed="false">Показать полигоны</button>
</aside>

<footer class="hud hint">Перетаскивайте, чтобы вращать · колесо или щипок — масштаб</footer>
<div id="loading">Наполняем аквариум…</div>

<!-- Classic scripts (not ES modules) so the page also works when opened straight from disk. -->
<script src="vendor/three.bundle.min.js"></script>
<script src="js/aquarium.js"></script>
</body>
</html>
